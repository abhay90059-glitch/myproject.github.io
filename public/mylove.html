<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', cursive;
  background: pink;
  overflow-x: hidden;
  text-align: center;
}h1 { color: darkred; margin-top: 30px; font-size: 28px; }

.container { padding: 15px; }

button { padding: 12px 25px; margin: 10px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; }

.yes-btn { background-color: red; color: white; }

.no-btn { background-color: white; color: red; }

img { width: 90%; max-width: 350px; border-radius: 15px; margin-top: 20px; }

.message { color: darkred; font-size: 16px; margin: 20px; }

.heart { position: fixed; bottom: -20px; font-size: 20px; animation: floatUp linear forwards; }

@keyframes floatUp { to { transform: translateY(-100vh); opacity: 0; } } </style>

</head>
<body><div class="container" id="mainContent">
  <h1>Will you be my valentines my love?</h1><button class="yes-btn" onclick="showLove()">Yes</button> <button class="no-btn">No</button>

  <div>
    <img src="proposal.jpeg" alt="Proposal Photo">
  </div>  <p class="message">
    We have been through a lot together, and there is a lot of uncertainty even now. I don't even know if I'm good or bad, but I know for sure I love you with my full heart and every part of my body. I love you my Anushri.
  </p>
</div><script>
function showLove() {
  document.getElementById('mainContent').innerHTML = `
    <h1 style="color:red;">I LOVE YOU ❤️</h1>
    <img src="love.jpeg" alt="Love Photo">
  `;

  setInterval(createHeart, 200);
}

function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
  heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}
</script></body>
</html>
